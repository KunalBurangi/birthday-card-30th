<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5e2e5">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="A birthday scrapbook, made with love.">
  <title>To You — A Birthday Scrapbook</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="glitter-sky" aria-hidden="true"></div>
  <main id="pink-birthday-premiere" class="book">
    <header class="book-bar">
      <a class="book-mark" href="./" aria-label="Return to the scrapbook cover"><span aria-hidden="true">♡</span> For you, always.</a>
      <button class="sound" type="button" aria-pressed="true">Sound on</button>
    </header>
    <article class="premiere" data-scene="0">
      <div class="premiere-copy">
        <p class="premiere-eyebrow">A birthday scrapbook</p>
        <h1 id="page-title">Happy birthday, love.</h1>
        <p class="premiere-caption" aria-live="polite">For the little girl in the photos and the woman I get to love today.</p>
        <div class="page-actions">
          <button class="premiere-action" type="button">Open the scrapbook</button>
          <button class="mic-action" type="button" hidden>Enable microphone</button>
          <button class="photo-next" type="button" hidden></button>
        </div>
        <p class="mic-status" role="status" hidden></p>
        <div class="note-panel" hidden aria-live="polite"></div>
      </div>
      <div class="premiere-art"></div>
    </article>
    <footer class="book-footer">
      <button class="book-back" type="button" hidden>Previous page</button>
      <span class="book-place"></span>
      <button class="book-note" type="button" aria-expanded="false" hidden>Open a little note</button>
    </footer>
  </main>
  <audio id="bg-music" loop preload="auto">
    <source src="happy-birthday.m4a" type="audio/mp4">
    <source src="happy-birthday.wav" type="audio/wav">
  </audio>
</body>
</html>
